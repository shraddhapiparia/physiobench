# PhysioBench configuration: guideline definitions and thresholds.
# src/bdr.py reads every threshold and boundary operator from this file; none
# is hard-coded elsewhere. Operators: ">=", ">", "<", "<=".

population:
  adult_min_age_years: 18          # RIDAGEYR >= 18 (age at screening)

quality:
  acceptable_grades: [A, B]        # CDC: A exceeds / B meets ATS standards

bdr:
  gina:
    name: GINA
    version: "2026"
    population: adults             # not applied to participants < adult_min_age_years
    measures: [FEV1, FVC]          # positive if EITHER measure meets BOTH criteria
    # Sources (wording checked against both PDFs):
    #   GINA 2026 Summary Guide, Table 1, p.8: "Adults: FEV1 or FVC increases by
    #     >=12% and by >=200 mL from the pre-bronchodilator value"
    #     https://ginasthma.org/wp-content/uploads/2026/07/GINA-Summary-Guide-2026-WEB-WMS.pdf
    #   GINA 2026 Strategy Report, Box 1-2, pp.28-29: "Adults: increase from
    #     baseline in FEV1 or FVC of >=12% and >=200 mL"
    #     https://ginasthma.org/wp-content/uploads/2026/05/GINA-2026-Strategy-Report-WMS.pdf
    # Both criteria apply to the same measurement; both operators are inclusive.
    pct_baseline:   {operator: ">=", threshold: 12}    # 100 * (post - pre) / pre
    abs_change_ml:  {operator: ">=", threshold: 200}   # post - pre, mL
  ats_ers:
    name: ERS/ATS
    version: "2022"
    # Primary source: Stanojevic S et al. ERS/ATS technical standard on interpretive
    #   strategies for routine lung function tests. Eur Respir J 2022;60:2101499.
    #   doi:10.1183/13993003.01499-2021. Criterion: change in FEV1 or FVC >10% of predicted.
    # Consistent with GINA 2026 Strategy Report p.22 (">10% predicted ... proposed in 2022").
    population: all                # computed at all ages; eligibility flags adults
    measures: [FEV1, FVC]          # positive if EITHER measure meets the criterion
    pct_predicted:  {operator: ">", threshold: 10}     # 100 * (post - pre) / GLI predicted

obstruction:
  fixed_ratio:
    name: Fixed ratio
    # Calculated at all ages; interpreted for adults only (an adult criterion),
    # via obstruction_fixed_ratio_adult.
    interpretation_population: adults
    fev1_fvc:       {operator: "<", threshold: 0.70}
  lln:
    name: GLI Global 2022 LLN
    reference: GLI Global 2022 (Bowerman et al., AJRCCM 2023), 5th centile
    fev1_fvc:       {operator: "<", threshold: lln}    # compared with gli_fev1fvc_lln
